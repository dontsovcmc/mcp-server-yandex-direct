[project]
name = "mcp-server-yandex-direct"
version = "0.3.0"
description = "MCP server for Yandex Direct API v5 — campaigns, ads, keywords, bids, audiences"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-server-yandex-direct = "mcp_server_yandex_direct:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_yandex_direct"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.21", "anyio>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
